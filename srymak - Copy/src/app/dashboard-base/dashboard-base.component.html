<div class="controller">
<nav class="navbar bg-body-tertiary w-100" style="background-color: #0f1f36;">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/dashboard"><img src="../../assets/mainicon.png" style="height: 30px;" alt="">
      <p>SRYMAK</p>
    </a>
    <i class="fa-solid fa-bars d-none" id="hamburgernav" style="font-size: 25px" (click)="tooglSidebar()"></i>
    <!-- <form class="d-flex" role="search">
      <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
      <button class="btn btn-outline-success" type="submit">Search</button>
    </form> -->
  </div>
</nav>
<div class="sidebar position-absolute" id="sidebar" (click)="tooglSidebar()">
  <i class="fa-solid fa-bars d-none" id="hamburger" style="font-size: 35px"></i>
  <div style="overflow:auto;flex:1">
  <div class="profile" id="profile" (click)="$event.stopPropagation()">
    <div class="section1" (click)="tooglSidebar()">
      <i class="fas fa-user-alt" style="font-size: 35px"></i>
    </div>
    <div class="section2">
      <div style="margin-right: 1rem;display: flex;flex-direction: column;align-items: center;">
        <div class="section1">
          <i class="fas fa-user-alt" style="font-size: 70px"></i>
        </div>

      </div>
      <div class="details">
        <p class="details-text" style="font-size: 110%;;">{{details.name}}</p>
        <p class="details-text">Grade - {{details.grade}}</p>
        <p class="details-text">Course - {{coursecodes[courseclass]}}</p>
      </div>
    </div>
  </div>
  <div class="pages flex-1 my-5" id="pages" (click)="$event.stopPropagation()">
    <div class="page" routerLink="/dashboard">
      <div class="section1 w-100 justify-content-center">
        <i class="fas fa-tachometer-alt" style="font-size: 40px; color:whitesmoke;"></i>
      </div>
      <div class="section2 ps-3">
        <i class="fas fa-tachometer-alt pe-4" style="font-size: 40px; color:black;"></i>
        <h4 style="font-weight: 700;">DASHBOARD</h4>
      </div>
    </div>
    <div class="page" (click)="alert('This option is available after session Starts')">
      <div class="section1 w-100 justify-content-center">
        <i class="fas fa-book-open" style="font-size: 40px; color:whitesmoke;"></i>
      </div>
      <div class="section2 ps-3">
        <i class="fas fa-book-open pe-4" style="font-size: 40px; color:black;"></i>
        <h4 style="font-weight: 700;">HOMEWORK</h4>
      </div>
    </div>
    <div class="page" (click)="alert('This option is available after session Starts')">
      <div class="section1 w-100 justify-content-center">
        <i class="fa-solid fa-question" style="font-size: 40px; color:whitesmoke;"></i>
      </div>
      <div class="section2 ps-3">
        <i class="fas fa-question pe-4" style="font-size: 40px; color:black;"></i>
        <h4 style="font-weight: 700;">QUIZ</h4>
      </div>
    </div>
    <div class="page" (click)="alert('This option is available after session Starts')">
      <div class="section1 w-100 justify-content-center">
        <i class="fas fa-poll" style="font-size: 40px; color:whitesmoke;"></i>
      </div>
      <div class="section2 ps-3">
        <i class="fas fa-poll pe-4" style="font-size: 40px; color:black;"></i>
        <h4 style="font-weight: 700;">RESULT</h4>
      </div>
    </div>
    <div class="page" routerLink="/profile" (click)="tooglSidebar()">
      <div class="section1 w-100 justify-content-center">
        <i class="fas fa-user" style="font-size: 40px; color:whitesmoke;"></i>
      </div>
      <div class="section2 ps-3">
        <i class="fas fa-user pe-4" style="font-size: 40px; color:black;"></i>
        <h4 style="font-weight: 700;">PROFILE</h4>
      </div>
    </div>
  </div>
  <div class="logout page" id="logout" (click)="$event.stopPropagation()">
    <div class="section1 w-100 justify-content-center" (click)="logout_user()" style="cursor:pointer">
      <i class="fas fa-sign-out-alt" style="font-size: 40px; color:red;"></i>
    </div>
    <div class="section2 ps-3" (click)="logout_user()" style="cursor:pointer;">
      <i class="fas fa-sign-out-alt pe-4" style="font-size: 40px; "></i>
      <h4 style="font-weight: 700;">LOGOUT</h4>
    </div>
  </div>
</div></div>
<div class="dashboard">

  <div class="content py-4 px-5">
  <router-outlet #o="outlet"></router-outlet>

  </div>
</div>
</div>
