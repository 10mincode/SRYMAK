<body id="mainbody">
  <a href="https://stse.srymak.com" id="stickyHeader" class="bg-danger text-white fw-bold text-center fs-5 py-2"
    style="position:fixed; top:0; width:100%; z-index:1500; text-decoration:none;">
    <div>
      🤑💸
      Announcing STSE
      2024: The Ultimate Talent
      Challenge
      for
      Future Leaders!
      ✍️📒💰
      <span class="fw-bold">Click to Register for STSE and Chance to Win Upto ₹500000</span>
    </div>
  </a>
  <app-root></app-root>
  <script>
    function adjustPadding() {
      var header = document.getElementById('stickyHeader');
      var body = document.getElementById('mainbody');
      var header_2 = document.getElementsByTagName('app-header')[0];
      header_2.classList.add('sticy-top')
      header_2.style.top = header.offsetHeight + 'px';
      header_2.style.position = 'sticky';
      header_2.style.zIndex = 1000;
      body.style.paddingTop = header.offsetHeight + 'px';
    }

    window.addEventListener('load', adjustPadding);
    window.addEventListener('resize', adjustPadding);
  </script>
