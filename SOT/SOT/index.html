                    </div>
                    <div class="fill-blank-ques p-3 text-start col-sm-12 col-md-6">

                    </div>
                    <div class="fill-blank-ques p-3 text-start col-sm-12 col-md-6">

                    </div>
                    <div class="fill-blank-ques p-3 text-start col-sm-12">

                    <div class="fill-blank-ques p-3 text-start col-sm-12 col-md-6">

                        <input type="text" class="p-2">

                    <div class="fill-blank-ques p-3 text-start col-sm-12 col-md-6">
                        <p>Study Certificate in pdf
                            <span class="required">*</span>
                        </p>
                        <input type="file" class="p-2">
                    </div>
                    <div class="fill-blank-ques p-3 text-start col-sm-12 col-md-6">
                        <p>Student Photo

                        <input type="file" class="p-2">
